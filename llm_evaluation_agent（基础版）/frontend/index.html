<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>评测方案生成助手</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>评测方案生成助手</h1>
        <p>填写产品信息，实时查看任务规划、执行动态与产物输出。</p>
      </div>
    </header>

    <main class="app-main">
      <aside class="history-pane" id="historyPane">
        <div class="history-top">
          <div class="history-title">
            <h3>历史任务</h3>
            <button type="button" id="historyCollapseBtn" class="collapse-btn" aria-expanded="true">收起</button>
          </div>
          <button type="button" id="newTaskBtn" class="primary-link">创建新任务</button>
        </div>
        <div class="history-search">
          <input id="historySearch" type="search" placeholder="搜索产品名称" />
        </div>
        <div class="history-list" id="historyList"></div>
      </aside>

      <section class="left-pane" id="formPane">
        <article class="card form-card">
          <h2>提交需求</h2>
          <div id="formAlert" class="alert hidden" role="status"></div>
          <form id="planForm">
            <div class="field">
              <label for="productName">产品名称 *</label>
              <input id="productName" name="product_name" required />
            </div>

            <div class="field">
              <label for="documentUpload">需求文档（Markdown / Word，可选）</label>
              <input
                id="documentUpload"
                name="document"
                type="file"
                accept=".md,.markdown,.docx,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              />
              <small class="hint">支持 Markdown (.md/.markdown) 与 Word (.docx) 文件，单个文件不超过 50 MB</small>
            </div>

            <div class="field">
              <label for="constraints">其他约束 / 说明</label>
              <textarea
                id="constraints"
                name="constraints"
                placeholder="输入业务目标、应用场景或其他补充说明"
              ></textarea>
            </div>

            <div class="actions">
              <button type="submit" id="submitBtn">开始生成</button>
              <div class="actions-inline">
                <button type="button" id="resetBtn" class="ghost-btn">重置表单</button>
                <button type="button" id="pauseBtn" class="pause-btn" disabled>暂停任务</button>
              </div>
              <p class="form-hint">系统将根据填写内容及上传文档触发规划与执行。</p>
            </div>
          </form>
        </article>
      </section>

      <section class="right-pane" id="detailPane">
        <article class="card progress-card">
          <div class="progress-header">
            <div class="progress-title">
              <h3>任务进度</h3>
              <small>生成计划后开始执行</small>
            </div>
            <div class="progress-actions">
              <strong id="planProgress">0 / 0</strong>
              <button type="button" id="progressToggle" class="progress-toggle" aria-expanded="true">
                收起
              </button>
            </div>
          </div>
          <div class="progress-body" id="progressBody">
            <div class="progress-meter">
              <span id="progressBar"></span>
            </div>
            <ul id="planList" class="step-list"></ul>
          </div>
        </article>

        <article class="timeline-card">
          <div class="timeline-header">
            <div>
              <h3>实时执行记录</h3>
              <div class="timeline-meta" id="timelineMeta">Request ID · ----</div>
            </div>
            <span class="status-pill" id="timelineStatus">等待执行</span>
          </div>
          <div class="ticker" id="timelineTicker">
            <span>--:--</span>
            <span>当前等待步骤规划，提交后将展示实时执行动态。</span>
          </div>
          <div class="timeline-list" id="timelineList">
            <div class="timeline-placeholder" id="timelineEmptyMessage">
              当前等待步骤规划。提交后将在此处展示实时执行动态。
            </div>
          </div>
          <div class="summary-panel" id="summaryPanel" hidden>
            <h4>任务总结</h4>
            <div id="summaryText"></div>
          </div>
          <div class="files-panel" id="filesPanel" hidden>
            <div class="files-panel-header">
              <h4>输出文件</h4>
              <button type="button" id="downloadAllBtn" class="ghost-btn ghost-btn--small">下载全部文件</button>
            </div>
            <div id="fileList"></div>
          </div>
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/main.js?v=20240924" type="module"></script>
  </body>
</html>
